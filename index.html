<!DOCTYPE html>
<html>

<head>

<title>AI Music Studio Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/wavesurfer.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#020617;
padding:18px;
font-size:22px;
}

.container{
max-width:520px;
margin:auto;
margin-top:25px;
background:#020617;
padding:20px;
border-radius:10px;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
background:#14b8a6;
color:black;
}

button:hover{
background:#0d9488;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:none;
}

.slider{
width:100%;
}

#waveform{
margin-top:20px;
}

</style>

</head>

<body>

<header>
AI MUSIC STUDIO PRO
</header>

<div class="container">

<h3>1. Upload Music</h3>

<input type="file" id="upload">

<h3>OR Paste YouTube Link</h3>

<input type="text" id="ytlink" placeholder="Paste YouTube link here">

<div id="waveform"></div>

<h3>2. Convert / Effects</h3>

<button onclick="bhajan()">Bhajan Mode</button>

<button onclick="remix()">Auto Remix</button>

<button onclick="male()">AI Male Voice</button>

<button onclick="female()">AI Female Voice</button>

<h3>3. Speed Control</h3>

<button onclick="slow()">Slow</button>

<button onclick="fast()">Fast</button>

<input class="slider" type="range" min="0.5" max="3" step="0.01" value="1" id="speed">

<h3>4. Volume</h3>

<input class="slider" type="range" min="0" max="1" step="0.01" value="1" id="volume">

<h3>5. Trim Music</h3>

<label>Start</label>

<input class="slider" type="range" min="0" max="100">

<label>End</label>

<input class="slider" type="range" min="0" max="100">

<h3>6. Play Music</h3>

<button onclick="play()">Play</button>

<button onclick="pause()">Pause</button>

<h3>7. Download Music</h3>

<button onclick="download()">Download</button>

</div>

<script>

let wavesurfer=WaveSurfer.create({
container:"#waveform",
waveColor:"#64748b",
progressColor:"#14b8a6",
height:80
});

const upload=document.getElementById("upload");
const volume=document.getElementById("volume");
const speed=document.getElementById("speed");

let musicURL="";

upload.addEventListener("change",function(){

const file=this.files[0];

musicURL=URL.createObjectURL(file);

wavesurfer.load(musicURL);

});

function play(){
wavesurfer.play();
}

function pause(){
wavesurfer.pause();
}

function slow(){
wavesurfer.setPlaybackRate(0.75);
}

function fast(){
wavesurfer.setPlaybackRate(1.5);
}

function bhajan(){
wavesurfer.setPlaybackRate(0.85);
wavesurfer.setVolume(0.8);
}

function remix(){
wavesurfer.setPlaybackRate(1.25);
}

function male(){
wavesurfer.setPlaybackRate(0.95);
}

function female(){
wavesurfer.setPlaybackRate(1.15);
}

speed.oninput=function(){
wavesurfer.setPlaybackRate(this.value);
}

volume.oninput=function(){
wavesurfer.setVolume(this.value);
}

function download(){

if(musicURL){

const a=document.createElement("a");

a.href=musicURL;

a.download="music.mp3";

a.click();

}

}

</script>

</body>

</html>
