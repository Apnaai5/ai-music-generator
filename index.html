<!DOCTYPE html>
<html>
<head>

<title>AI Music Studio Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/wavesurfer.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
text-align:center;
}

header{
background:black;
padding:15px;
font-size:20px;
}

.container{
max-width:520px;
margin:auto;
margin-top:40px;
background:#111;
padding:25px;
border-radius:12px;
box-shadow:0 0 30px rgba(0,0,0,0.7);
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
background:#00ffd5;
color:black;
}

button:hover{
background:#00c9a7;
}

.slider{
width:100%;
margin-top:10px;
}

#waveform{
margin-top:20px;
}

</style>

</head>

<body>

<header>
AI MUSIC STUDIO PRO
</header>

<div class="container">

<h3>Upload Music</h3>

<input type="file" id="upload">

<div id="waveform"></div>

<br>

<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>

<br>

<button onclick="slow()">Slow</button>
<button onclick="fast()">Fast</button>

<button onclick="bhajan()">Bhajan Mode</button>
<button onclick="remix()">Auto Remix</button>

<br>

<button onclick="male()">Male Voice</button>
<button onclick="female()">Female Voice</button>

<br>

<label>Start Trim</label>
<input class="slider" type="range" min="0" max="100" value="0" id="start">

<label>End Trim</label>
<input class="slider" type="range" min="0" max="100" value="100" id="end">

<br>

<button onclick="exportAudio()">Export Music</button>

<br><br>

<label>Custom Speed</label>
<input class="slider" type="range" min="0.5" max="3" step="0.01" value="1" id="speed">

<label>Volume</label>
<input class="slider" type="range" min="0" max="1" step="0.01" value="1" id="volume">

</div>

<script>

let wavesurfer=WaveSurfer.create({
container:"#waveform",
waveColor:"#888",
progressColor:"#00ffd5",
height:80
});

const upload=document.getElementById("upload");
const volume=document.getElementById("volume");
const speed=document.getElementById("speed");

let musicURL="";

upload.addEventListener("change",function(){

const file=this.files[0];

musicURL=URL.createObjectURL(file);

wavesurfer.load(musicURL);

});

function play(){
wavesurfer.play();
}

function pause(){
wavesurfer.pause();
}

function slow(){
wavesurfer.setPlaybackRate(0.75);
}

function fast(){
wavesurfer.setPlaybackRate(1.5);
}

function bhajan(){
wavesurfer.setPlaybackRate(0.85);
wavesurfer.setVolume(0.8);
}

function remix(){
wavesurfer.setPlaybackRate(1.25);
}

function male(){
wavesurfer.setPlaybackRate(0.95);
}

function female(){
wavesurfer.setPlaybackRate(1.15);
}

speed.oninput=function(){
wavesurfer.setPlaybackRate(this.value);
}

volume.oninput=function(){
wavesurfer.setVolume(this.value);
}

function exportAudio(){

if(musicURL){

const a=document.createElement("a");

a.href=musicURL;

a.download="music_export.mp3";

a.click();

}

}

</script>

</body>

</html>
